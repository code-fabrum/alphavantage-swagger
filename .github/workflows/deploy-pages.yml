name: Deploy to External Hosting

on:
  push:
    branches:
      - main # Triggers deployment when you push to the main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download the source code from your repository
      - name: Checkout Code
        uses: actions/checkout@v5

      # Step 2: Upload the documentation using explicit FTPS encryption.
      - name: Deploy documentation via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTPS_HOST }}
          username: ${{ secrets.FTPS_USERNAME }}
          password: ${{ secrets.FTPS_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./docs/
          server-dir: domains/av.fabrumholdings.com/public_html/
          dangerous-clean-slate: false

      - name: Deployment Complete
        run: echo "Website deployed successfully"