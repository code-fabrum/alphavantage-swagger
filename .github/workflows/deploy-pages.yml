name: Deploy to External Hosting

on:
  push:
    branches:
      - main # Triggers deployment when you push to the main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download the source code from your repository
      - name: Checkout Code
        uses: actions/checkout@v5

      # Step 2: Connect and sync files to the external hosting server
      - name: Sync Files via SFTP/SSH
        uses: easingthemes/ssh-deploy@v4
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.SERVER_HOST }}
          REMOTE_USER: ${{ secrets.SERVER_USER }}
          SOURCE: "docs/" # Syncs the whole repo. Change to "dist/" if you build a framework site
          TARGET: "domains/av.fabrumholdings.com/public_html" # Adjust this to your hosting root folder
          ARGS: "-rltgoDzv --delete" # --delete removes old files on the server not present in GitHub


      - name: Deployment Complete
        run: echo "Website deployed successfully"